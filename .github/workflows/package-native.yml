name: Package native applications

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-native-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: BuildGraph
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test uber JAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Prepare jpackage input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path jpackage-input | Out-Null
          Copy-Item -LiteralPath target/BuildGraph.jar -Destination jpackage-input/BuildGraph.jar
          Copy-Item -LiteralPath LICENSE -Destination jpackage-input/LICENSE

      - name: Create self-contained application with jpackage
        shell: pwsh
        run: |
          $arguments = @(
            '--type', 'app-image',
            '--input', 'jpackage-input',
            '--dest', 'dist',
            '--name', $env:APP_NAME,
            '--app-version', $env:APP_VERSION,
            '--main-jar', 'BuildGraph.jar',
            '--main-class', 'dtm.bulder.Main',
            '--description', 'BuildGraph build system for C and C++'
          )
          if ('${{ runner.os }}' -eq 'Windows') {
            $arguments += '--win-console'
          }
          & jpackage @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Smoke test packaged launcher
        shell: pwsh
        run: |
          if ('${{ runner.os }}' -eq 'Windows') {
            & 'dist/BuildGraph/BuildGraph.exe' --help
          } elseif ('${{ runner.os }}' -eq 'Linux') {
            & 'dist/BuildGraph/bin/BuildGraph' --help
          } else {
            & 'dist/BuildGraph.app/Contents/MacOS/BuildGraph' --help
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Archive portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          if ('${{ runner.os }}' -eq 'Windows') {
            $archive = Join-Path $PWD "release-assets/BuildGraph-$env:APP_VERSION-windows-x64.zip"
            Compress-Archive -Path 'dist/BuildGraph' -DestinationPath $archive
          } elseif ('${{ runner.os }}' -eq 'Linux') {
            $archive = Join-Path $PWD "release-assets/BuildGraph-$env:APP_VERSION-linux-x64.tar.gz"
            & tar -C dist -czf $archive BuildGraph
          } else {
            $archive = Join-Path $PWD "release-assets/BuildGraph-$env:APP_VERSION-macos-x64.zip"
            & ditto -c -k --sequesterRsrc --keepParent 'dist/BuildGraph.app' $archive
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload downloadable package
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/*
          archive: false
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create tagged release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create tag and permanent GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "Expected 3 native packages, found ${#assets[@]}" >&2
            exit 1
          fi

          tag="v${APP_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "BuildGraph ${APP_VERSION}" \
              --generate-notes \
              --latest
          fi
