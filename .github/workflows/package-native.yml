name: Package native applications

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-native-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: BuildGraph

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve semantic version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
              Write-Error "Release tag must use semantic versioning (for example v1.2.3)"
              exit 1
            }
            $version = $Matches[1]
          } else {
            $version = ([xml](Get-Content -Raw pom.xml)).project.properties.revision
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and test uber JAR
        shell: pwsh
        run: mvn --batch-mode --no-transfer-progress "-Drevision=$env:APP_VERSION" clean package

      - name: Create self-contained application with jpackage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projectRoot = $PWD.Path
          $JarPath = (Resolve-Path -LiteralPath 'target/BuildGraph.jar').Path
          $Destination = Join-Path $projectRoot 'dist'
          $AppVersion = $env:APP_VERSION

          $temporaryInput = Join-Path $projectRoot ('target/jpackage-input-' + [Guid]::NewGuid().ToString('N'))
          $temporaryIconset = $null
          $temporaryIconFiles = [Collections.Generic.List[string]]::new()
          New-Item -ItemType Directory -Path $temporaryInput -Force | Out-Null
          try {
              Copy-Item -LiteralPath $JarPath -Destination (Join-Path $temporaryInput 'BuildGraph.jar')
              Copy-Item -LiteralPath (Join-Path $projectRoot 'LICENSE') -Destination (Join-Path $temporaryInput 'LICENSE')
              $packageArguments = @(
                  '--type', 'app-image',
                  '--input', $temporaryInput,
                  '--dest', $Destination,
                  '--name', 'BuildGraph',
                  '--app-version', $AppVersion,
                  '--main-jar', 'BuildGraph.jar',
                  '--main-class', 'dtm.builder.Main',
                  '--description', 'BuildGraph build system for C and C++'
              )
              if ([Environment]::OSVersion.Platform -eq [PlatformID]::Win32NT) {
                  $icon = (Resolve-Path -LiteralPath (Join-Path $projectRoot 'BuildGraph.ico')).Path
                  $packageArguments += @('--win-console', '--icon', $icon)
              } elseif ([Runtime.InteropServices.RuntimeInformation]::IsOSPlatform([Runtime.InteropServices.OSPlatform]::OSX)) {
                  $png = (Resolve-Path -LiteralPath (Join-Path $projectRoot 'BuildGraph.png')).Path
                  $iconId = [Guid]::NewGuid().ToString('N')
                  $temporaryIconset = Join-Path $projectRoot ("target/jpackage-icon-$iconId.iconset")
                  New-Item -ItemType Directory -Path $temporaryIconset | Out-Null
                  $sizes = [ordered]@{
                      'icon_16x16.png' = 16
                      'icon_16x16@2x.png' = 32
                      'icon_32x32.png' = 32
                      'icon_32x32@2x.png' = 64
                      'icon_128x128.png' = 128
                      'icon_128x128@2x.png' = 256
                      'icon_256x256.png' = 256
                      'icon_256x256@2x.png' = 512
                      'icon_512x512.png' = 512
                      'icon_512x512@2x.png' = 1024
                  }
                  foreach ($size in $sizes.GetEnumerator()) {
                      $resized = Join-Path $temporaryIconset $size.Key
                      $temporaryIconFiles.Add($resized)
                      & /usr/bin/sips -z $size.Value $size.Value $png --out $resized | Out-Null
                      if ($LASTEXITCODE -ne 0) {
                          throw "sips failed with exit code $LASTEXITCODE"
                      }
                  }
                  $icon = Join-Path $projectRoot ("target/jpackage-icon-$iconId.icns")
                  $temporaryIconFiles.Add($icon)
                  & /usr/bin/iconutil -c icns -o $icon $temporaryIconset
                  if ($LASTEXITCODE -ne 0) {
                      throw "iconutil failed with exit code $LASTEXITCODE"
                  }
                  $packageArguments += @('--icon', $icon)
              } elseif ([Runtime.InteropServices.RuntimeInformation]::IsOSPlatform([Runtime.InteropServices.OSPlatform]::Linux)) {
                  $icon = (Resolve-Path -LiteralPath (Join-Path $projectRoot 'BuildGraph.png')).Path
                  $packageArguments += @('--icon', $icon)
              }
              & jpackage @packageArguments
              if ($LASTEXITCODE -ne 0) {
                  throw "jpackage failed with exit code $LASTEXITCODE"
              }
          } finally {
              foreach ($temporaryIcon in $temporaryIconFiles) {
                  if (Test-Path -LiteralPath $temporaryIcon -PathType Leaf) {
                      Remove-Item -LiteralPath $temporaryIcon
                  }
              }
              if ($temporaryIconset -and (Test-Path -LiteralPath $temporaryIconset -PathType Container) -and
                      @(Get-ChildItem -LiteralPath $temporaryIconset -Force).Count -eq 0) {
                  Remove-Item -LiteralPath $temporaryIconset
              }
              foreach ($fileName in @('BuildGraph.jar', 'LICENSE')) {
                  $temporaryFile = Join-Path $temporaryInput $fileName
                  if (Test-Path -LiteralPath $temporaryFile -PathType Leaf) {
                      Remove-Item -LiteralPath $temporaryFile
                  }
              }
              if ((Test-Path -LiteralPath $temporaryInput -PathType Container) -and
                      @(Get-ChildItem -LiteralPath $temporaryInput -Force).Count -eq 0) {
                  Remove-Item -LiteralPath $temporaryInput
              }
          }

      - name: Smoke test packaged launcher
        shell: pwsh
        run: |
          if ('${{ runner.os }}' -eq 'Windows') {
            & 'dist/BuildGraph/BuildGraph.exe' --help
          } elseif ('${{ runner.os }}' -eq 'Linux') {
            & 'dist/BuildGraph/bin/BuildGraph' --help
          } else {
            & 'dist/BuildGraph.app/Contents/MacOS/BuildGraph' --help
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Archive portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          if ('${{ runner.os }}' -eq 'Windows') {
            $archive = Join-Path $PWD "release-assets/BuildGraph-$env:APP_VERSION-windows-x64.zip"
            Compress-Archive -Path 'dist/BuildGraph' -DestinationPath $archive
          } elseif ('${{ runner.os }}' -eq 'Linux') {
            $archive = Join-Path $PWD "release-assets/BuildGraph-$env:APP_VERSION-linux-x64.tar.gz"
            & tar -C dist -czf $archive BuildGraph
          } else {
            $archive = Join-Path $PWD "release-assets/BuildGraph-$env:APP_VERSION-macos-x64.zip"
            & ditto -c -k --sequesterRsrc --keepParent 'dist/BuildGraph.app' $archive
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload downloadable package
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/*
          archive: false
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create tagged release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Create permanent GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "Expected 3 native packages, found ${#assets[@]}" >&2
            find release-assets -maxdepth 2 -print >&2
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "BuildGraph ${tag#v}" \
              --generate-notes \
              --latest
          fi
